name: PROJECT STRIKE Android APK
# CI: Godot 4.4 Android SDK, NDK, CMake and debug signing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "PROJECT_STRIKE/**"
      - ".github/workflows/project-strike-android.yml"

permissions:
  contents: read

jobs:
  android-apk:
    name: Export Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages required by Godot 4.4
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Create temporary Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install matching Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          unzip -oq /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Import and validate project
        run: godot --headless --editor --path PROJECT_STRIKE --quit

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/../.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p PROJECT_STRIKE/build
          godot --headless --path PROJECT_STRIKE --export-debug "Android" PROJECT_STRIKE/build/PROJECT_STRIKE-debug.apk

      - name: Verify APK output
        run: |
          test -s PROJECT_STRIKE/build/PROJECT_STRIKE-debug.apk
          file PROJECT_STRIKE/build/PROJECT_STRIKE-debug.apk
          ls -lh PROJECT_STRIKE/build/PROJECT_STRIKE-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-STRIKE-Android-APK
          path: PROJECT_STRIKE/build/PROJECT_STRIKE-debug.apk
          if-no-files-found: error
          retention-days: 14
