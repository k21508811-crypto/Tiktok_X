name: Unity license activation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation:
    name: Request Unity Personal activation file
    runs-on: ubuntu-latest
    steps:
      - name: Generate manual activation file
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.28f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity-6000.3.28f1-activation
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7
