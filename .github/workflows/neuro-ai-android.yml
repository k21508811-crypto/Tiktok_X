name: NEURO AI Android

on:
  push:
    branches: [ main, feature/neuro-ai-android ]
    paths:
      - 'NEURO_AI/**'
      - '.github/workflows/neuro-ai-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'NEURO_AI/**'
      - '.github/workflows/neuro-ai-android.yml'
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p NEURO_AI/android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: neuro-ai-debug-apk
          path: NEURO_AI/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    # GitHub intentionally restricts secrets in pull_request workflows from forks.
    # Release signing is only attempted on trusted push/manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add all four secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore and validate release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neuro-ai-release.jks"
          test -s "$RUNNER_TEMP/neuro-ai-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/neuro-ai-release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null
      - name: Build signed release APK and AAB
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/neuro-ai-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p NEURO_AI/android :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: neuro-ai-release-apk
          path: NEURO_AI/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: neuro-ai-release-aab
          path: NEURO_AI/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
