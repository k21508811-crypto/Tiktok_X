name: NEURO AI Android

on:
  push:
    branches: [ main, feature/neuro-ai-android ]
    paths:
      - 'NEURO_AI/**'
      - '.github/workflows/neuro-ai-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'NEURO_AI/**'
      - '.github/workflows/neuro-ai-android.yml'
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p NEURO_AI/android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: neuro-ai-debug-apk
          path: NEURO_AI/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    # Unsigned release builds do not need repository secrets.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned release APK and AAB
        run: gradle -p NEURO_AI/android :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: neuro-ai-release-apk-unsigned
          path: NEURO_AI/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: neuro-ai-release-aab-unsigned
          path: NEURO_AI/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
