name: NEURO AI Android Release

on:
  push:
    branches: [ main, feature/neuro-ai-android ]
    paths:
      - 'NEURO_AI/**'
      - '.github/workflows/neuro-ai-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'NEURO_AI/**'
      - '.github/workflows/neuro-ai-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # Do not publish release artifacts from untrusted pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/neuro-ai-release.jks"
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$STORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias neuroai \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NEURO AI, OU=Android, O=NEURO AI, L=Amsterdam, ST=North Holland, C=NL"
          echo "RELEASE_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=neuroai" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build signed Release APK and AAB
        run: gradle -p NEURO_AI/android :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature
        run: |
          APK="NEURO_AI/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"

      - name: Verify AAB signature
        run: |
          AAB="NEURO_AI/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB"

      - uses: actions/upload-artifact@v4
        with:
          name: neuro-ai-release-apk
          path: NEURO_AI/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: neuro-ai-release-aab
          path: NEURO_AI/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
