name: NEURO AI — Release APK only

on:
  push:
    branches:
      - feature/neuro-ai-android
    paths:
      - "NEURO_AI/android/**"
      - ".github/workflows/neuro-ai-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ""

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate temporary signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/neuro-ai-temporary-release.jks"
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$STORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias neuroai \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NEURO AI, OU=Android, O=NEURO AI, C=NL"
          {
            echo "RELEASE_STORE_FILE=$STORE"
            echo "RELEASE_STORE_PASSWORD=$PASS"
            echo "RELEASE_KEY_ALIAS=neuroai"
            echo "RELEASE_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Build Release APK only
        working-directory: NEURO_AI/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="NEURO_AI/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: neuro-ai-release-apk
          path: NEURO_AI/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
