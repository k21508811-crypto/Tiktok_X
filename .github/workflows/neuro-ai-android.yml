name: NEURO AI Android

on:
  push:
    branches: [ main, feature/neuro-ai-android ]
    paths:
      - 'NEURO_AI/**'
      - '.github/workflows/neuro-ai-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'NEURO_AI/**'
      - '.github/workflows/neuro-ai-android.yml'
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p NEURO_AI/android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: neuro-ai-debug-apk
          path: NEURO_AI/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release build skipped: configure all four signing secrets."
          fi
      - uses: actions/checkout@v4
        if: steps.signing.outputs.enabled == 'true'
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.enabled == 'true'
      - name: Restore release keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neuro-ai-release.jks"
          test -s "$RUNNER_TEMP/neuro-ai-release.jks"
      - name: Build signed release APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/neuro-ai-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p NEURO_AI/android :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: neuro-ai-release-apk
          path: NEURO_AI/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: neuro-ai-release-aab
          path: NEURO_AI/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
