name: PROJECT STRIKE Unity Android

on:
  workflow_dispatch:
  push:
    branches: [unity-migration]
    paths:
      - "PROJECT_STRIKE_UNITY/**"
      - ".github/workflows/project-strike-unity-android.yml"

permissions:
  contents: read

jobs:
  android:
    name: Build Unity Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity Personal license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Activate a Unity Personal license in Unity Hub, then add UNITY_LICENSE (.ulf contents), UNITY_EMAIL and UNITY_PASSWORD as repository Actions secrets."
            exit 1
          fi

      - name: Build Android APK with Unity 6.3 LTS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: PROJECT_STRIKE_UNITY
          unityVersion: 6000.3.28f1
          targetPlatform: Android
          buildName: PROJECT_STRIKE
          customParameters: -nographics

      - name: Verify APK
        run: |
          find build -type f -name "*.apk" -print -quit | grep -q .
          find build -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-STRIKE-Unity-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 14
